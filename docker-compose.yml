services:
  mysql:
    image: mysql:8.0
    container_name: skilltranscript-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: skilltranscript
      MYSQL_USER: skilltranscript
      MYSQL_PASSWORD: skilltranscript
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -prootpass --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app:
    image: node:20-alpine
    container_name: skilltranscript-app
    working_dir: /app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXTAUTH_URL: http://localhost:3000
      AUTH_SECRET: change-this-secret
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: skilltranscript
      DB_PASSWORD: skilltranscript
      DB_NAME: skilltranscript
    volumes:
      - .:/app
      - /app/node_modules
    command: >
      sh -lc "npm install && npm run build && npm run start -- --hostname 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  mysql-data:
