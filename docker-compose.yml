services:
  mysql:
    image: mysql:8.0
    container_name: skilltranscript-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: skilltranscript
      MYSQL_USER: skilltranscript
      MYSQL_PASSWORD: skilltranscript
    ports:
      - "3386:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -prootpass --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  app_skilltranscript086:
    image: arraya086/skilltranscript:v02
    container_name: skilltranscript-app-086
    working_dir: /app

    depends_on:
      mysql:
        condition: service_healthy

    env_file:
      - .env

    environment:
      NODE_ENV: production
      PORT: 3000
      NEXTAUTH_URL: https://miscis.scidi.tsu.ac.th:3086
      AUTH_URL: https://miscis.scidi.tsu.ac.th:3086
      AUTH_TRUST_HOST: "true"

      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: skilltranscript
      DB_PASSWORD: skilltranscript
      DB_NAME: skilltranscript
      WATCHPACK_POLLING: "true"
    expose:
      - "3000"
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    container_name: skilltranscript-caddy
    restart: unless-stopped
    depends_on:
      - app_skilltranscript086
    ports:
      - "80:80"
      - "443:443"
      - "3086:3086"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  mysql-data:
  caddy-data:
  caddy-config:
